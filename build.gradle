buildscript {
    repositories {
        maven { url 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:[6.0,6.2)'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.xingyi.autofarmer'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            mods { autofarmer { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            mods { autofarmer { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
}

repositories {
    mavenCentral()
}

jar {
    archiveBaseName.set('autofarmer')
    manifest {
        attributes([
            "Specification-Title"     : "autofarmer",
            "Specification-Vendor"    : "xingyi",
            "Specification-Version"   : "${version}",
            "Implementation-Title"    : "autofarmer",
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : "xingyi",
        ])
    }
}

jar.finalizedBy('reobfJar')
